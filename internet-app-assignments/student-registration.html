<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>Student Registration Form</h2>
  <form>
    <label>Full Name: <input type="text" name="fullname" required /></label><br />
    <label>Student ID: <input type="text" name="student_id" required /></label><br />
    <label>Email: <input type="email" name="email" required /></label><br />
    <label>Course: <input type="text" name="course" required /></label><br />
    <label>Year: 
      <select name="year">
        <option>1st</option>
        <option>2nd</option>
        <option>3rd</option>
        <option>4th</option>
      </select>
    </label><br />
    <button type="submit">Submit</button>
  </form>
</body>
</html>
